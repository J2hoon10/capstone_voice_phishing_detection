services:
  classifier:
    build:
      context: ./models/classifier
    container_name: phishing-classifier
    environment:
      ROBERTA_MAMBA_MODEL_PATH: ${ROBERTA_MAMBA_MODEL_PATH:-/app/checkpoints/roberta_mamba_freeze_init_4class_4class_20260517_174922_best.pt}
      CLASSIFIER_DEVICE: ${CLASSIFIER_DEVICE:-cuda}

      REALTIME_STT_WINDOW_SECONDS: ${REALTIME_STT_WINDOW_SECONDS:-20}
      REALTIME_STT_STRIDE_SECONDS: ${REALTIME_STT_STRIDE_SECONDS:-10}
      REALTIME_MODEL_POLL_SECONDS: ${REALTIME_MODEL_POLL_SECONDS:-0.5}
    volumes:
      - ./models/classifier/checkpoints:/app/checkpoints
      - hf-cache:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    expose:
      - "8001"

  guidance:
    build:
      context: ./models/guidance
    container_name: phishing-guidance
    expose:
      - "8002"

  backend:
    build:
      context: ./backend
    container_name: phishing-backend
    environment:
      CLASSIFIER_URL: ${CLASSIFIER_URL:-http://classifier:8001}
      GUIDANCE_URL: ${GUIDANCE_URL:-http://guidance:8002}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      - classifier
      - guidance
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: phishing-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  hf-cache:
